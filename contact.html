<body>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9177883250634221"
     crossorigin="anonymous"></script>
    <header class="header">
        <nav class="nav-container">
            <div class="logo">Travel Budget</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>

                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-container">
        <h1>Contact Us</h1>
        <form class="contact-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" required placeholder="Enter your message"></textarea>
            </div>

            <button type="submit" class="submit-button">Send Message</button>
        </form>

        <div class="social-links">
            <h2>Follow Us</h2>
            <div class="social-icons">
                <a href="#" class="social-icon">Facebook</a>
                <a href="#" class="social-icon">Twitter</a>
                <a href="#" class="social-icon">Instagram</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Travel Budget Planner. All rights reserved.</p>
    </footer>
</body>
